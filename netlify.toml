[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF backend/"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  EXPO_PUBLIC_API_URL = "https://imply-sitting-grating.ngrok-free.dev"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
